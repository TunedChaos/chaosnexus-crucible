[package]
name = "chaosnexus-crucible"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Local LLM inference service for ChaosNexus (Candle + MCP client)"
repository = "https://codeberg.org/TunedChaos/chaosnexus-crucible"
homepage = "https://chaosnexus.ai"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
hf-hub = { version = "0.4.3", features = ["tokio"] }
rust-mcp-sdk = "0.10.0"
rust-mcp-transport = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokenizers = { version = "0.23.1", features = ["http"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.3"
uuid = { version = "1.18", features = ["v4", "serde"] }
